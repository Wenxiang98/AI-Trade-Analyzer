# Server
# Railway injects $PORT — always honour it, fall back to 8080 locally
server.port=${PORT:8080}

# PostgreSQL (Supabase) — set these as env vars on Railway
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Supabase JWT secret — get from Supabase Dashboard > Settings > API > JWT Settings
supabase.jwt.secret=${SUPABASE_JWT_SECRET}

# CORS — frontend origin
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Claude API
claude.api.url=https://api.anthropic.com/v1/messages
claude.model=claude-haiku-4-5

# Twelve Data market data API
twelvedata.api.key=${TWELVEDATA_API_KEY}
