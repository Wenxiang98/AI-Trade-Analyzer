# ===== RAILWAY DEPLOYMENT PROFILE =====
# Active automatically when SPRING_PROFILES_ACTIVE=railway is set in Railway env vars.
# No database needed yet — backend serves market data + Claude proxy only.

# Railway injects $PORT at runtime
server.port=${PORT:8080}

# Disable database (not needed until we add user-specific backend endpoints)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Supabase JWT secret (needed to verify tokens on authenticated endpoints)
supabase.jwt.secret=${SUPABASE_JWT_SECRET}

# CORS — set to your Vercel frontend URL in Railway env vars
cors.allowed-origins=${CORS_ORIGINS}

# Claude API
claude.api.url=https://api.anthropic.com/v1/messages
claude.model=claude-haiku-4-5

# Twelve Data market data API
twelvedata.api.key=${TWELVEDATA_API_KEY}

# Logging
logging.level.com.aitrade=INFO
